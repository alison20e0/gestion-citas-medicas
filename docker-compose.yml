services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: citas-web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DEBUG: "1"
      DB_ENGINE: django.db.backends.postgresql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: citas_db
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-secretpassword123}
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    container_name: citas-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: citas_db
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secretpassword123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d citas_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
