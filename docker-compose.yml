services:
  postgres:
    image: postgres:16-alpine
    container_name: citas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-citas_db}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secretpassword123}
    ports:
      - "${DB_PORT_PUBLISHED:-5443}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-citas_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: citas-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8083}:8080"
    environment:
      SERVER_PORT: 8080
      TZ: ${TZ:-America/Guayaquil}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-citas_db}
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-secretpassword123}
      CITA_ZONA_HORARIA: ${CITA_ZONA_HORARIA:-America/Guayaquil}
      NOTIFICACIONES_HABILITADAS: ${NOTIFICACIONES_HABILITADAS:-true}
      NOTIFICACIONES_SIMULAR_FALLO: ${NOTIFICACIONES_SIMULAR_FALLO:-false}
      NOTIFICACIONES_HORAS_ANTICIPACION: ${NOTIFICACIONES_HORAS_ANTICIPACION:-24}
      NOTIFICACIONES_MAX_INTENTOS: ${NOTIFICACIONES_MAX_INTENTOS:-4}
      NOTIFICACIONES_ESPERA_REINTENTO: ${NOTIFICACIONES_ESPERA_REINTENTO:-30s}
      NOTIFICACIONES_INTERVALO_BARRIDO_MS: ${NOTIFICACIONES_INTERVALO_BARRIDO_MS:-60000}
      NOTIFICACIONES_LATENCIA: ${NOTIFICACIONES_LATENCIA:-120ms}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  postgres_data: